<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Inscripcion activada</title>
</head>
<body style="font-family: Arial, sans-serif; background:#f3f4f6; padding:24px; color:#1f2937;">
<div style="max-width:560px; margin:0 auto; background:#ffffff; border-radius:8px; padding:32px;">
    <h2 style="margin-top:0;">¡Inscripcion confirmada! 🎓</h2>
    <p>Hola <strong th:text="${fullName}">Estudiante</strong>,</p>
    <p>
        Tu pago fue procesado correctamente y ya estas inscrito/a en el curso:
    </p>
    <p style="font-size:18px; padding:12px 16px; background:#eef2ff; border-radius:6px;">
        <strong th:text="${courseName}">Nombre del Curso</strong>
    </p>
    <p>Tu progreso inicia en <strong>0%</strong>. Conforme completes modulos lo veras reflejado en tu dashboard.</p>
    <p>¡A estudiar!</p>
    <hr style="border:none; border-top:1px solid #e5e7eb; margin:24px 0;"/>
    <p style="font-size:12px; color:#6b7280;" th:text="${platformName}">UEES Plataforma de Cursos</p>
</div>
</body>
</html>
