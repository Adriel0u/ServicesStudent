spring:
  application:
    name: student-services
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/student_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USER:student}
    password: ${DB_PASSWORD:student123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
    open-in-view: false
    show-sql: false

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        acknowledge-mode: auto
        prefetch: 5
        retry:
          enabled: true
          initial-interval: 2s
          max-attempts: 5
          multiplier: 2

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME:changeme}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html

server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /

logging:
  level:
    root: INFO
    com.uees.studentservices: DEBUG
    org.springframework.security: INFO
    org.springframework.amqp: INFO

# Custom properties
app:
  security:
    jwt:
      secret: ${JWT_SECRET:eUVTRC1JTkdfV0VCXzIwMjZfU3VwZXJTZWNyZXRfS2V5X0F0X0xlYXN0XzMyX2J5dGVz}
      access-token-expiration-ms: 3600000        # 1 hora
      refresh-token-expiration-ms: 1209600000    # 14 dias
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  rabbit:
    enrollments-exchange: enrollments.exchange
    enrollment-activated-queue: student.enrollment.activated.q
    enrollment-activated-routing-key: enrollment.activated
    module-completed-queue: student.module.completed.q
    module-completed-routing-key: module.completed
    dead-letter-exchange: enrollments.dlx
    dead-letter-routing-key: enrollments.dlq
  mail:
    from: ${MAIL_FROM:no-reply@uees-lms.local}
    from-name: ${MAIL_FROM_NAME:UEES Plataforma de Cursos}
  espocrm:
    base-url: ${ESPOCRM_BASE_URL:http://localhost:8082}
    api-key: ${ESPOCRM_API_KEY:changeme}
    enabled: ${ESPOCRM_ENABLED:false}
  learning-engine:
    base-url: ${LEARNING_ENGINE_URL:http://localhost:8080}
    api-prefix: /api

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:student_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:mysql://mysql-student:3306/student_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
  rabbitmq:
    host: rabbitmq
