<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"/>
    <title>Foro - Demo WebSocket STOMP</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 16px; }
        h1 { font-size: 22px; }
        label { font-weight: 600; display:block; margin-top:12px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        button { margin-top: 12px; padding: 10px 18px; background:#4f46e5; color:#fff; border:0; border-radius: 6px; cursor:pointer;}
        #log { background:#0f172a; color:#e2e8f0; padding:14px; border-radius:8px; height:280px; overflow:auto; margin-top:18px; font-size:13px;}
        .msg { padding:8px; border-bottom:1px solid #1e293b;}
        .msg .who { color:#7dd3fc; font-weight:600; }
    </style>
</head>
<body>
    <h1>Foro WebSocket — Demo</h1>
    <p>Endpoint: <code>/ws-forum</code> (SockJS) o <code>/ws</code> &middot; Topic: <code>/topic/course/{id}/forum</code></p>

    <label>Course ID (UUID)</label>
    <input id="courseId" value="11111111-1111-1111-1111-111111111111"/>

    <label>JWT (opcional para SEND)</label>
    <input id="token" placeholder="paste access token"/>

    <button id="connectBtn">Conectar</button>
    <button id="disconnectBtn" disabled>Desconectar</button>

    <label>Mensaje</label>
    <textarea id="content" rows="2">Hola desde la demo!</textarea>
    <button id="sendBtn" disabled>Enviar</button>

    <div id="log"></div>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script>
        let stomp = null;

        function log(html) {
            const d = document.getElementById('log');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = html;
            d.appendChild(div);
            d.scrollTop = d.scrollHeight;
        }

        document.getElementById('connectBtn').onclick = () => {
            const courseId = document.getElementById('courseId').value.trim();
            const token = document.getElementById('token').value.trim();
            const socket = new SockJS('/ws-forum');
            stomp = Stomp.over(socket);
            const headers = token ? { Authorization: 'Bearer ' + token } : {};
            stomp.connect(headers, () => {
                log('<span class="who">SYS:</span> conectado');
                document.getElementById('connectBtn').disabled = true;
                document.getElementById('disconnectBtn').disabled = false;
                document.getElementById('sendBtn').disabled = false;
                stomp.subscribe('/topic/course/' + courseId + '/forum', m => {
                    const data = JSON.parse(m.body);
                    log('<span class="who">' + (data.studentName || data.studentId) + ':</span> ' + data.content);
                });
            }, err => log('<span class="who">ERR:</span> ' + err));
        };

        document.getElementById('disconnectBtn').onclick = () => {
            if (stomp) stomp.disconnect(() => log('<span class="who">SYS:</span> desconectado'));
            document.getElementById('connectBtn').disabled = false;
            document.getElementById('disconnectBtn').disabled = true;
            document.getElementById('sendBtn').disabled = true;
        };

        document.getElementById('sendBtn').onclick = () => {
            const courseId = document.getElementById('courseId').value.trim();
            const content = document.getElementById('content').value;
            stomp.send('/app/course/' + courseId + '/forum', {}, JSON.stringify({ content }));
        };
    </script>
</body>
</html>
